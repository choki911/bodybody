<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>あたま・かた・ひざ・ポン AIゲーム</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 10px 0;
            font-size: 1.5rem;
            color: #333;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        video {
            display: none; /* ビデオ要素は隠してキャンバスに描画します */
        }

        canvas {
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* 鏡のように左右反転 */
        }

        #overlay-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 下のCanvasへのクリックを透過 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        #status-text {
            color: white;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            text-align: center;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 10px;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        button {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #loading {
            margin-top: 20px;
            font-size: 1rem;
            color: #666;
        }

        /* iPad向け調整 */
        @media (max-width: 768px) {
            h1 { font-size: 1.2rem; }
            #status-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <h1>あたま・かた・ひざ・ポン</h1>

    <div id="canvas-container">
        <video id="video" playsinline webkit-playsinline></video>
        <canvas id="output"></canvas>

        <div id="overlay-ui">
            <div id="status-text">準備中...</div>
        </div>

        <div id="start-screen">
            <h2>全身を映して遊んでね</h2>
            <button id="start-btn" disabled>カメラを起動中...</button>
            <div id="loading">AIモデルを読み込み中...</div>
        </div>
    </div>

<script>
    // --- 設定・状態管理 ---
    const VIDEO_WIDTH = 640;
    const VIDEO_HEIGHT = 480;
    
    // ゲームの状態
    let detector;
    let video;
    let canvas, ctx;
    let isGameRunning = false;
    let currentStage = 0; // 0:待機, 1:あたま, 2:かた, 3:ひざ, 4:ポン
    let lastTouchTime = 0;
    
    // ターゲットの定義 (部位名とMoveNetのキーポイント名の対応)
    const STAGES = [
        { id: 'start', text: 'スタート！', sound: null },
        { id: 'atama', text: 'あたま', keypoint: 'nose', soundFile: 'atama.m4a' },
        { id: 'kata', text: 'かた', keypoint: ['left_shoulder', 'right_shoulder'], soundFile: 'kata.m4a' },
        { id: 'hiza', text: 'ひざ', keypoint: ['left_knee', 'right_knee'], soundFile: 'hiza.m4a' },
        { id: 'pon', text: 'ポン！(手をたたいて)', action: 'clap', soundFile: 'pon.m4a' } // 手拍子は手首同士の距離で判定
    ];

    // オーディオコンテキスト（効果音生成用）
    let audioCtx;

    async function init() {
        video = document.getElementById('video');
        canvas = document.getElementById('output');
        ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const loadingText = document.getElementById('loading');

        canvas.width = VIDEO_WIDTH;
        canvas.height = VIDEO_HEIGHT;

        try {
            // 1. カメラのセットアップ
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user', // インカメラ
                    width: VIDEO_WIDTH,
                    height: VIDEO_HEIGHT
                },
                audio: false
            });
            video.srcObject = stream;
            
            await new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    resolve(video);
                };
            });
            video.play();

            // 2. MoveNetモデルのロード
            const model = poseDetection.SupportedModels.MoveNet;
            const detectorConfig = {
                modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING // 軽量モデル
            };
            detector = await poseDetection.createDetector(model, detectorConfig);

            // 準備完了
            loadingText.style.display = 'none';
            startBtn.innerText = "スタート！";
            startBtn.disabled = false;
            
            startBtn.addEventListener('click', () => {
                // Web Audio APIの初期化（ユーザー操作が必要）
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                document.getElementById('start-screen').style.display = 'none';
                isGameRunning = true;
                startGameLoop();
                render();
            });

        } catch (error) {
            console.error(error);
            loadingText.innerText = "エラー: カメラへのアクセスを許可してください。\n(HTTPS接続が必要です)";
            alert("カメラの起動に失敗しました。iOSの場合はSafariを使用し、カメラへのアクセスを許可してください。");
        }
    }

    // --- ゲームロジック ---

    async function startGameLoop() {
        // ゲームのメインループ
        currentStage = 1; // あたまからスタート
        await playStage(currentStage);
    }

    async function playStage(stageIndex) {
        if (stageIndex >= STAGES.length) {
            // ゲーム終了 -> 最初に戻る
            currentStage = 1;
            setTimeout(() => playStage(1), 1000); 
            return;
        }

        const stage = STAGES[stageIndex];
        updateStatus(stage.text);
        
        // 部位の音声を再生
        await playSound(stage.soundFile, stage.text);

        // 判定待ち状態にする
        // (renderループ内で距離判定を行い、成功したらnextStageを呼ぶ)
    }

    async function nextStage() {
        // ピンポーン音
        playPinPon();
        
        // 正解演出
        updateStatus("OK! ✨");
        
        await new Promise(r => setTimeout(r, 1000)); // 余韻

        currentStage++;
        playStage(currentStage);
    }

    // --- 描画と判定ループ ---

    async function render() {
        if (!isGameRunning) return;

        // ポーズ推定の実行
        const poses = await detector.estimatePoses(video);
        
        // 描画クリア
        ctx.drawImage(video, 0, 0, VIDEO_WIDTH, VIDEO_HEIGHT);

        if (poses.length > 0) {
            const keypoints = poses[0].keypoints;
            
            // 信頼度が高い点だけ描画（デバッグ用・またはガイド用）
            // drawKeypoints(keypoints, 0.3, ctx); 

            // 現在のステージに応じた判定処理
            if (currentStage > 0 && currentStage < STAGES.length) {
                checkHit(keypoints, STAGES[currentStage]);
            }
        }

        requestAnimationFrame(render);
    }

    // 当たり判定ロジック
    function checkHit(keypoints, stageData) {
        const hands = [
            keypoints.find(k => k.name === 'left_wrist'),
            keypoints.find(k => k.name === 'right_wrist')
        ];

        let targetPoints = [];
        let isHit = false;

        // ターゲット座標の取得
        if (stageData.action === 'clap') {
            // 手拍子（手と手の距離）
            if (hands[0] && hands[1] && hands[0].score > 0.3 && hands[1].score > 0.3) {
                const dist = getDistance(hands[0], hands[1]);
                // ターゲット描画（中心）
                drawTargetCircle((hands[0].x + hands[1].x)/2, (hands[0].y + hands[1].y)/2, 50, 'yellow');
                
                if (dist < 80) isHit = true; // 手同士が近い
            }
        } else {
            // 部位へのタッチ
            if (Array.isArray(stageData.keypoint)) {
                stageData.keypoint.forEach(name => {
                    const kp = keypoints.find(k => k.name === name);
                    if (kp) targetPoints.push(kp);
                });
            } else {
                const kp = keypoints.find(k => k.name === stageData.keypoint);
                if (kp) targetPoints.push(kp);
            }

            // ターゲットを描画し、手との距離を測る
            targetPoints.forEach(target => {
                if (target.score > 0.3) {
                    drawTargetCircle(target.x, target.y, 60, '#ff6b6b');

                    // どちらかの手がターゲットに近いか
                    hands.forEach(hand => {
                        if (hand && hand.score > 0.3) {
                            const dist = getDistance(hand, target);
                            // 手を描画（確認用）
                            ctx.beginPath();
                            ctx.arc(hand.x, hand.y, 20, 0, 2 * Math.PI);
                            ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
                            ctx.fill();

                            if (dist < 100) isHit = true; // 判定閾値
                        }
                    });
                }
            });
        }

        // ヒットした場合、連続判定を防ぐために少し時間を空ける
        const now = Date.now();
        if (isHit && (now - lastTouchTime > 1500)) {
            lastTouchTime = now;
            nextStage();
        }
    }

    // --- ユーティリティ ---

    function getDistance(p1, p2) {
        return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
    }

    function drawTargetCircle(x, y, radius, color) {
        // 点滅アニメーションのような効果
        const time = Date.now() / 300;
        const animatedRadius = radius + Math.sin(time) * 5;

        ctx.beginPath();
        ctx.arc(x, y, animatedRadius, 0, 2 * Math.PI);
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(x, y, animatedRadius, 0, 2 * Math.PI);
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.3;
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }

    function updateStatus(text) {
        document.getElementById('status-text').innerText = text;
    }

    function drawKeypoints(keypoints, minConfidence, ctx) {
        keypoints.forEach(keypoint => {
            if (keypoint.score >= minConfidence) {
                const {x, y} = keypoint;
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, 2 * Math.PI);
                ctx.fillStyle = 'Red';
                ctx.fill();
            }
        });
    }

    // --- 音声処理システム ---

    async function playSound(filename, textToSpeak) {
        return new Promise((resolve) => {
            if (!filename) {
                speak(textToSpeak, resolve);
                return;
            }

            const audio = new Audio(filename);
            audio.onended = resolve;
            audio.onerror = () => {
                console.warn(`${filename} が見つかりません。合成音声を使用します。`);
                speak(textToSpeak, resolve);
            };
            
            // 再生試行
            audio.play().catch(e => {
                console.warn("再生エラー(インタラクション不足等):", e);
                speak(textToSpeak, resolve);
            });
        });
    }

    function playPinPon() {
        const audio = new Audio('pinpon.mp3');
        audio.play().catch(() => {
            // ファイルがない場合はWeb Audio APIでチャイム音を合成
            playSynthChime();
        });
    }

    // バックアップ用：合成音声 (Web Speech API)
    function speak(text, callback) {
        if (!window.speechSynthesis) {
            if (callback) setTimeout(callback, 1000);
            return;
        }
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.0;
        uttr.onend = callback;
        window.speechSynthesis.speak(uttr);
    }

    // バックアップ用：電子音チャイム
    function playSynthChime() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, audioCtx.currentTime); // ミ
        osc.frequency.setValueAtTime(523, audioCtx.currentTime + 0.1); // ド (ピンポーン)
        
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }

    // 初期化実行
    window.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
